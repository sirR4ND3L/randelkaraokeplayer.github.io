<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Karaoke | Song Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <h1>Karaoke Song Management System</h1>
    <h3 style="text-align: center; color: rgb(159, 209, 250);">Total Songs: <span id="totalSongs" style="color: rgb(103, 252, 83);">0</span></h3>
    <div class="admin-search" style="max-width: 600px; margin: 0 auto 20px; display: flex; gap: 10px;">
        <input type="text" id="searchInput" placeholder="Search by title, artist, or number..." oninput="debouncedLoad()" style="margin-bottom: 0;">
        <button onclick="loadSongs()" style="width: auto; white-space: nowrap; padding: 0 25px;">Search</button>
    </div>
    <div class="action-buttons">
        <button class="saveAllSong" onclick="saveAllUnverified()" style="margin-bottom: 20px; padding: 10px; background-color: #22c55e; color: white; border: none; border-radius: 50px; width: auto; margin: 5px; cursor: pointer;">Save All Unverified</button>
        <button class="reEditSong" onclick="reEditAllSongs()" style="margin-bottom: 20px; padding: 10px; border: none; border-radius: 50px; width: auto; margin: 5px; cursor: pointer">Re-edit All Songs</button>
    </div>
    <details class="add-song-panel" id="addSongPanel">
        <summary>➕ Add Song Manually</summary>
        <div class="add-song-grid">
            <input type="text" id="newSongTitle" placeholder="Title (e.g. Perfect)" autocomplete="off">
            <input type="text" id="newSongArtist" placeholder="Artist (e.g. Ed Sheeran)" autocomplete="off">
            <input type="text" id="newSongVideo" placeholder="YouTube URL or Video ID" autocomplete="off">
            <input type="number" id="newSongNumber" placeholder="Number" min="1" step="1" autocomplete="off">
            <input type="text" id="newSongQuery" class="span-all" placeholder="Search key (optional) - leave empty to build it from the title" autocomplete="off">
            <button id="addSongBtn" onclick="addSongManually()">Add to Songbook</button>
        </div>
        <p class="add-song-hint" id="addSongHint">Leave the number empty to append at the end of the songbook.</p>
    </details>
    <div id="songContainer">Loading...</div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
