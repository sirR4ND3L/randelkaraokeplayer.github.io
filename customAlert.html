<div id="customAlert" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 id="alertTitle">Alert</h3>
        <p id="alertMessage"></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="cancelAlert" onclick="closeCustomAlert(false)" style="background: #64748b; display: none;">Cancel</button>
            <button id="closeAlert" onclick="closeCustomAlert(true)">OK</button>
        </div>
    </div>
</div>
