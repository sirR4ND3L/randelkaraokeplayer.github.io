<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Page Not Found | Randel Karaoke Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you were looking for does not exist.">
    <link rel="icon" type="image/png" sizes="32x32" href="/randelkaraokeplayer.github.io/images/favicon-32x32.png">
    <style>
        :root {
            --bg: #030303;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.65);
            --accent: #a855f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 24px;
            text-align: center;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 12vw, 5rem);
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0.5) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
        }

        a {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        a:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <h1>404</h1>
    <p>That page is not on the playlist.</p>
    <a href="/randelkaraokeplayer.github.io/">Back to the player</a>
</body>

</html>
